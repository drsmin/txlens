# 룰 사전 v1 — 결정론 매칭이 쓰는 유일한 지식원 (blueprint §3.3 ②)
#
# ## 범위: head 브랜드 29개만 (D-022)
#
# 생성기의 브랜드 카탈로그는 정답 라벨을 이미 들고 있다. 그걸 통째로 복사하면 룰만으로 정답이
# 나와 "룰의 한계"라는 출발 논거와 §5.2 전이 실험의 개선폭이 함께 무너진다. 그래서 실무 사전이
# 실제로 만들어지는 방식 — **건수 많은 브랜드부터 채우고 tail 은 손대지 못한 채 남는다** — 을
# 따라 head 29개(`frequency >= 1.0`)만 담았다. tail 7개(을지로호프·성수동카페·연세이비인후과·
# 우리동네세탁·스텝짐·낙원떡집·영어의달인학원)는 **의도적으로 비워** LLM·HITL 이 일할 자리로 둔다.
#
# ## 키 4종
#
# - `exact`  — 정규화된 가맹점명 완전일치. 비워두면 `canonical` 자신이 키가 된다.
# - `alias`  — 법인명·로마자 표기. 전처리가 표기만 벗기고 **의미 변환은 하지 않으므로**
#              (`preprocess.strip_corporate` 의 주석) 여기서 브랜드로 잇는다.
# - `regex`  — 접두 패턴. 공백 없이 붙은 지점명(`김밥천국종로3가점`)이나 꼬리에 붙은 잡음을 흡수한다.
# - `regno`  — 사업자등록번호. **v1 은 비어 있다** (아래 참고).
#
# 모든 키는 **정규화된 형태**(NFKC·대문자·법인표기/지점 제거 후)로 적는다. 로더가 이를 검사해
# `(주)스타벅스` 처럼 적으면 실패시킨다 — 사전에만 있고 실제로는 절대 매칭되지 않는 키를 막는다.
#
# ## alias 를 좁게 유지하는 규칙 (D-022)
#
# - `(주)브랜드…` 형태는 전처리의 법인표기 제거만으로 exact 에 걸리므로 **적지 않는다.**
# - **가상 브랜드(빈스로드·한끼밥상·데일리마트·스텝짐멤버십·클라우드백업)의 법인명은 적지 않는다.**
#   "사람도 표기만 보고는 모르는 최고난도" 케이스로 만든 것이라, 법인명 alias 를 넣으면 스스로
#   함정을 해제한다. 로마자 표기(`BEANS ROAD` → `빈스로드`)는 사람이 읽어 옮길 수 있으므로 넣는다.
# - `쿠팡` 과 `쿠팡와우` 는 법인명이 같다(`(주)쿠팡`). 법인명 alias 를 어느 쪽에 붙여도 다른 쪽을
#   틀리게 만들므로 **양쪽 모두 넣지 않는다** — 법인명만 온 표기는 사람이 봐도 구분할 수 없다.
# - PG사명(`케이지이니시스` 등)은 사전에 넣지 않는다. 실가맹점이 소실된 표기라 추측 대상이 아니고,
#   `preprocess` 가 `pg_masked` 로 판정해 `미분류(pg_masked)` 로 보낸다.
#
# ## regex 를 접두로만, 지점이 붙는 브랜드에만 두는 이유
#
# 접두 regex 는 뒤에 무엇이 붙어도 잡으므로 강력하지만 그만큼 위험하다. 그래서 **지점 표기가
# 실제로 붙는 브랜드**(`has_branch`)에만 뒀다. `^쿠팡` 처럼 **다른 브랜드의 접두가 되는 패턴은
# 쓰지 않는다** — 짧은 쪽이 긴 쪽의 오타(`쿠팡우` → 쿠팡와우)를 삼켜 조용히 틀린 답을 만든다.
#
# ## regno 가 비어 있는 이유 (D-012)
#
# 사업자등록번호는 **점포 단위**라 같은 브랜드가 지점마다 다른 번호를 갖고, 채워지는 정도도
# 제공기관마다 다르며, PG 경유면 PG사 번호가 온다. 즉 사전에 미리 적어둘 수 있는 성질이 아니고,
# **사람이 교정할 때 함께 기록되어야** 쌓인다. 그래서 v1 의 REGNO 단계는 0건을 잡는다 —
# 이 숫자가 승격 루프(5주차)에서 올라가는 것 자체가 지표다. 단계 구현은 비워두지 않는다.

version: 1

#: `rapidfuzz.token_set_ratio` 임계값. 미달은 미매칭으로 남긴다 (억지 추측 금지 — blueprint §3.3 ②).
fuzzy_threshold: 90

entries:
  # ── 일상 소비 (head) ─────────────────────────────────────────────────────
  - canonical: 스타벅스
    l1: cafe
    l2: cafe.coffee
    alias: [에스씨케이컴퍼니, STARBUCKS]
    regex: ['^스타벅스']

  - canonical: GS25
    l1: food
    l2: food.convenience
    alias: [지에스리테일]
    regex: ['^GS25']

  - canonical: CU
    l1: food
    l2: food.convenience
    alias: [씨유]
    # `CULTURE…` 같은 다른 상호를 삼키지 않도록 뒤에 영문이 이어지면 제외한다.
    regex: ['^CU(?![A-Z])']

  - canonical: 이마트
    l1: food
    l2: food.grocery
    alias: [EMART]
    regex: ['^이마트']

  - canonical: 쿠팡
    l1: shopping
    l2: shopping.online
    alias: [COUPANG]
    # `^쿠팡` 은 두지 않는다 — `쿠팡와우` 의 오타를 삼킨다 (위 규칙).

  - canonical: 배달의민족
    l1: food
    l2: food.delivery
    alias: [우아한형제들, BAEMIN]

  - canonical: 투썸플레이스
    l1: cafe
    l2: cafe.bakery
    alias: [TWOSOME]
    regex: ['^투썸플레이스']

  - canonical: 김밥천국
    l1: food
    l2: food.restaurant
    regex: ['^김밥천국']

  - canonical: 교촌치킨
    l1: food
    l2: food.restaurant
    alias: [교촌에프앤비, KYOCHON]
    regex: ['^교촌치킨']

  - canonical: 서울교통공사
    l1: transport
    l2: transport.transit

  - canonical: 카카오T
    l1: transport
    l2: transport.taxi
    alias: [카카오모빌리티, KAKAO T]

  - canonical: SK에너지
    l1: transport
    l2: transport.fuel
    alias: [에스케이에너지, SK ENERGY]
    regex: ['^SK에너지']

  - canonical: 올리브영
    l1: health
    l2: health.beauty
    alias: [씨제이올리브영, OLIVE YOUNG]
    regex: ['^올리브영']

  - canonical: 다이소
    l1: shopping
    l2: shopping.living
    alias: [아성다이소, DAISO]
    regex: ['^다이소']

  - canonical: 무신사
    l1: shopping
    l2: shopping.fashion
    alias: [MUSINSA]

  - canonical: 메가박스
    l1: culture
    l2: culture.hobby
    alias: [메가박스중앙, MEGABOX]
    regex: ['^메가박스']

  - canonical: 교보문고
    l1: culture
    l2: culture.book
    alias: [KYOBO]
    regex: ['^교보문고']

  - canonical: 동네약국
    l1: health
    l2: health.pharmacy
    regex: ['^동네약국']

  - canonical: 한빛주차장
    l1: transport
    l2: transport.parking
    regex: ['^한빛주차장']

  # ── 가상 브랜드 (법인명 alias 금지 — 로마자만) ────────────────────────────
  - canonical: 빈스로드
    l1: cafe
    l2: cafe.coffee
    alias: [BEANS ROAD]
    regex: ['^빈스로드']

  - canonical: 한끼밥상
    l1: food
    l2: food.restaurant
    alias: [HANKKI]
    regex: ['^한끼밥상']

  - canonical: 데일리마트
    l1: food
    l2: food.grocery
    alias: [DAILY MART]
    regex: ['^데일리마트']

  # ── 구독 (주기 결제 — 지점이 없어 접두 regex 를 두지 않는다) ──────────────
  - canonical: 넷플릭스
    l1: culture
    l2: culture.content
    alias: [넷플릭스서비시스코리아, NETFLIX]

  - canonical: 유튜브프리미엄
    l1: culture
    l2: culture.content
    alias: [구글코리아, YOUTUBE PREMIUM]

  - canonical: 멜론
    l1: culture
    l2: culture.content
    alias: [MELON]

  - canonical: 쿠팡와우
    l1: shopping
    l2: shopping.online
    alias: [COUPANG WOW]

  - canonical: SKT통신요금
    l1: housing
    l2: housing.telecom
    alias: [에스케이텔레콤, SKT]

  - canonical: 스텝짐멤버십
    l1: health
    l2: health.fitness
    alias: [STEP GYM MEMBERSHIP]

  - canonical: 클라우드백업
    l1: culture
    l2: culture.content
    alias: [CLOUD BACKUP]
